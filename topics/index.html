<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Topics — SafeHere</title>
  <meta name="description" content="Explore topics about life, hope, and faith. SafeHere offers a safe space to discover what matters most.">
  <link rel="canonical" href="https://safehere.net/topics/">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
  <style>
    :root {
      --color-bg: #f5f5f3;
      --color-surface: #ffffff;
      --color-text: #1e2328;
      --color-text-muted: #5f6b7a;
      --color-accent: #3d6b5e;
      --color-border: rgba(30, 35, 40, 0.08);
      --font-display: 'Instrument Serif', Georgia, serif;
      --font-sans: 'Outfit', system-ui, sans-serif;
      --radius: 12px;
      --shadow: 0 1px 3px rgba(0, 0, 0, 0.06);
    }
    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      margin: 0;
      font-family: var(--font-sans);
      font-size: 1.05rem;
      line-height: 1.7;
      color: var(--color-text);
      background: var(--color-bg);
      min-height: 100vh;
    }
    .container {
      max-width: 42rem;
      margin: 0 auto;
      padding: 2rem 1.5rem 4rem;
    }
    .back {
      display: inline-block;
      margin-bottom: 1rem;
      font-size: 0.85rem;
      color: var(--color-accent);
      text-decoration: none;
      font-weight: 500;
    }
    .back:hover { text-decoration: underline; }
    header {
      text-align: center;
      padding: 2rem 0 2rem;
    }
    header h1 {
      font-family: var(--font-display);
      font-size: clamp(1.75rem, 4vw, 2.5rem);
      font-weight: 400;
      color: var(--color-text);
      margin: 0;
    }
    header p {
      color: var(--color-text-muted);
      margin-top: 0.5rem;
      font-size: 0.95rem;
    }
    .placeholder {
      background: var(--color-surface);
      padding: 2.5rem 2rem;
      border-radius: var(--radius);
      border: 1px solid var(--color-border);
      box-shadow: var(--shadow);
      text-align: center;
      color: var(--color-text-muted);
      font-style: italic;
    }
    footer {
      text-align: center;
      padding: 2rem 1rem;
      font-size: 0.85rem;
      color: var(--color-text-muted);
    }
    footer a {
      color: var(--color-accent);
      text-decoration: none;
    }
    footer a:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <div class="container">
    <a href="/" class="back">&larr; Back to SafeHere</a>

    <header>
      <h1>Topics</h1>
      <p>Explore topics about life, hope, and faith</p>
    </header>

    <div class="placeholder">
      <p>Topics are coming soon. We're preparing content to help you explore life's biggest questions.</p>
    </div>

    <footer>
      <p>SafeHere — <a href="https://safehere.net">safehere.net</a></p>
    </footer>
  </div>
</body>
</html>
